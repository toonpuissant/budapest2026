<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15263A">
<title>Boedapest met Amelie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: één scherm per dag, vaste dagkiezer bovenaan, tijdlijn van kaarten of een kaart; Praktisch als aparte weergave. */
:root{
  --bg:#F2EFEA; --card:#FFFFFF; --line:#E6E2DB; --line2:#D8D4CC;
  --ink:#15263A; --muted:#5A6778; --chip:#E3E6EA; --chip-ink:#3A4A5C;
  --navy:#15263A; --navy-ink:#F2EFEA;
  --paprika:#C94A2C; --gold:#D9A62B; --gold-bg:#FBE9C4; --gold-ink:#6B4E06; --teal:#2E6E7E;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A26; --card:#1B2634; --line:#2A3645; --line2:#34425380; --ink:#EEF0F2; --muted:#A7B1BD; --chip:#283443; --chip-ink:#C9D1DA;
    --navy:#0C141E; --navy-ink:#EEF0F2; --paprika:#E0623F; --gold:#E3B23C; --gold-bg:#3B2F12; --gold-ink:#F2D27B; --teal:#5FB0C2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A26; --card:#1B2634; --line:#2A3645; --line2:#34425380; --ink:#EEF0F2; --muted:#A7B1BD; --chip:#283443; --chip-ink:#C9D1DA;
  --navy:#0C141E; --navy-ink:#EEF0F2; --paprika:#E0623F; --gold:#E3B23C; --gold-bg:#3B2F12; --gold-ink:#F2D27B; --teal:#5FB0C2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
a{color:var(--ink)}
button{font-family:var(--body)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}

/* Kop */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top,0px)}
.hd{padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.hd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hd h1{font-size:26px;font-weight:800;line-height:1.05}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1.5px solid rgba(242,239,234,.35);background:transparent;color:var(--navy-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
.iconbtn[aria-pressed="true"]{background:var(--paprika);border-color:var(--paprika);color:#fff}
.tabs{display:flex;gap:6px}
.tab{flex:1;height:50px;border-radius:12px;border:1px solid rgba(242,239,234,.25);background:transparent;color:var(--navy-ink);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.tab small{font-size:11px;font-weight:500;opacity:.7}
.tab[aria-selected="true"]{background:var(--paprika);border-color:var(--paprika);color:#fff}
.tab[aria-selected="true"] small{opacity:.9}
.tab:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Dagkop */
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;flex-direction:column;gap:10px}
.dayhead h2{font-size:24px;font-weight:700}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.sun{background:var(--gold-bg);color:var(--gold-ink)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:var(--chip-ink);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Tijdlijn */
.tl{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:stretch}
.when{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:14px}
.when b{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.when i{flex:1;width:2px;background:var(--line2);border-radius:1px}
.when i.dash{background:repeating-linear-gradient(to bottom,var(--line2) 0 4px,transparent 4px 8px)}
.card{flex:1;min-width:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.card.hl{border:1.5px solid var(--paprika)}
.card.opt{border-style:dashed}
.card-btn{width:100%;text-align:left;background:transparent;border:0;color:inherit;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;font-size:inherit}
.card-btn:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ttl h3{font-size:17px;font-weight:700;line-height:1.2}
.badge{flex-shrink:0;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.badge.hl{background:var(--paprika);color:#fff}
.badge.today{background:var(--gold);color:#15263A}
.badge.opt{background:var(--chip);color:var(--chip-ink)}
.desc{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 8px;border-radius:6px;background:var(--chip);color:var(--chip-ink);font-size:11px;font-weight:600}
.chip.alt{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.chip.todo{background:var(--gold-bg);color:var(--gold-ink)}
.travel{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);padding:0 0 2px 56px;line-height:1.4}
.travel svg{flex-shrink:0;margin-top:1px}

/* Open kaart */
.more{border-top:1px solid var(--line);padding:0 0 16px;display:flex;flex-direction:column;gap:14px}
.more>*:not(.photo){margin-left:16px;margin-right:16px}
.more>.photo+*{margin-top:0}
.more>:first-child:not(.photo){margin-top:14px}
.photo{margin:0;display:flex;flex-direction:column;gap:4px}
.photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--chip);max-width:100%}
.photo figcaption{font-size:11px;color:var(--muted);padding:0 16px}
.photo figcaption a{color:var(--muted)}
.more p{margin:0;font-size:14px;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact span{font-size:13px;font-weight:600}
.more h4{font-family:var(--display);font-size:16px;font-weight:700;margin:0}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px 14px;border:1px solid var(--line);cursor:pointer}
.alt.on{border:1.5px solid var(--paprika)}
.alt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--paprika);flex-shrink:0}
.alt b{font-size:14px;font-weight:600;display:block}
.alt span{font-size:13px;color:var(--muted);line-height:1.45}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:10px;padding:11px 14px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;min-height:44px}
.lnk.nav{background:var(--teal);border-color:var(--teal);color:#fff}
.lnk svg{flex-shrink:0}

/* Kaart */
.mapwrap{display:flex;flex-direction:column;gap:10px}
#map{height:min(62vh,560px);border-radius:14px;border:1px solid var(--line);background:var(--chip)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--paprika)}
.legend i.d{border-top-style:dashed;border-color:var(--teal)}
.legend b{display:inline-block;width:14px;height:14px;border-radius:7px;background:var(--navy);border:2px solid #fff;box-shadow:0 0 0 1px var(--navy)}
.maplist{display:flex;flex-direction:column;gap:6px}
.mapitem{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;color:inherit;font-size:14px;min-height:44px}
.num{width:26px;height:26px;border-radius:13px;background:var(--paprika);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.num.h{background:var(--navy)}
.mk{width:30px;height:30px;border-radius:15px;background:var(--paprika);color:#fff;font:700 13px/30px var(--body);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.h{background:#15263A;font-size:11px}
.leaflet-popup-content b{font-family:var(--display);font-size:14px}
.leaflet-popup-content{color:#15263A}
.note{font-size:12px;color:var(--muted)}

/* Praktisch */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:18px;font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.list>*{border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.chk{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--teal);flex-shrink:0}
.chk .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chk b{font-size:14px;font-weight:600}
.chk.done b{text-decoration:line-through;color:var(--muted)}
.chk small{font-size:12px;color:var(--muted)}
.chk a{font-size:12px;color:var(--teal);font-weight:600;text-decoration:none;white-space:nowrap}
.addr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:var(--ink);min-height:44px}
.addr b{font-size:14px;font-weight:600;display:block}
.addr small{font-size:12px;color:var(--muted)}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.5}
.txt p{margin:0}
footer{padding:24px 16px 40px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--teal)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.more{animation:open .18s ease-out}@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}

/* Leaflet (minimale subset, inline zodat de pagina zonder externe CSS werkt) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;outline-offset:1px;font-family:var(--body);touch-action:none;-webkit-tap-highlight-color:transparent}
.leaflet-container img{max-width:none!important}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.3);border-radius:8px;overflow:hidden}
.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;width:36px;height:36px;line-height:36px;display:block;text-align:center;text-decoration:none;color:#15263A;font:bold 18px/36px var(--body)}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 5px;font-size:10px;color:#333;line-height:1.4}
.leaflet-control-attribution a{color:#2E6E7E}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}
.leaflet-popup-content{margin:12px 24px 12px 16px;line-height:1.4;font-size:13px;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#15263A;box-shadow:0 3px 14px rgba(0,0,0,.35)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:28px;height:28px;font:16px/28px sans-serif;color:#757575;text-decoration:none;background:transparent}
.leaflet-div-icon{background:transparent;border:none}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="hd-top">
      <div>
        <div class="eyebrow">5 – 8 november 2026</div>
        <h1>Boedapest<br>met Amelie</h1>
      </div>
      <button class="iconbtn" id="btnPrak" aria-label="Praktisch" aria-pressed="false" title="Praktisch">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.6"></circle></svg>
      </button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<main class="wrap main" id="main"></main>

<footer>Routes op de kaart: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · routering <a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener">FOSSGIS</a>. Foto's: Wikimedia Commons, licentie per foto vermeld. Tijden zijn richttijden; kies gerust een alternatief, de keuze wordt op deze telefoon bewaard.</footer>

/* ================= STATE ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('bp.'+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bp.'+k, JSON.stringify(v)); }catch(e){} }
};
let view = 'list';         // list | map | prak
let dayId = 'do';
let open = null;           // id van open kaart
let map = null, layer = null;

function todayDefault(){
  const d = new Date();
  if (d.getFullYear()===2026 && d.getMonth()===10){
    const m = {5:'do',6:'vr',7:'za',8:'zo'}[d.getDate()];
    if (m) return m;
  }
  return 'do';
}
function slotState(s){
  const a = s.alts ? (s.alts.find(x=>x.id===store.get('alt.'+s.id, s.alts[0].id)) || s.alts[0]) : null;
  return { ll: (a && a.ll) ? a.ll : s.ll, alt:a };
}
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= AFSTANDEN & ROUTES ================= */
function hav(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]), dLon=toR(b[1]-a[1]); const h=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function rkey(a,b){ return 'route.'+a.map(x=>x.toFixed(4)).join(',')+'|'+b.map(x=>x.toFixed(4)).join(','); }
async function fetchRoute(a,b){
  const cached = store.get(rkey(a,b), null);
  if (cached) return cached;
  const c = `${a[1]},${a[0]};${b[1]},${b[0]}`;
  const urls = [
    `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${c}?overview=full&geometries=geojson`,
    `https://router.project-osrm.org/route/v1/foot/${c}?overview=full&geometries=geojson`
  ];
  for (const u of urls){
    try{
      const r = await fetch(u); if(!r.ok) continue;
      const j = await r.json(); if(!j.routes||!j.routes[0]) continue;
      const out = { km: j.routes[0].distance/1000, pts: j.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]) };
      store.set(rkey(a,b), out); return out;
    }catch(e){}
  }
  return null;
}
function legs(day){
  const out = [];
  let prev = null;
  day.slots.forEach(s=>{
    const st = slotState(s);
    if (prev && s.travel) out.push({from:prev, to:st.ll, mode:s.travel.mode, label:s.travel.label});
    prev = st.ll;
  });
  if (day.ret && prev) out.push({from:prev, to:HOTEL.ll, mode:day.ret.mode, label:day.ret.label, ret:true});
  return out;
}
async function walkingKm(day){
  let km = 0;
  for (const l of legs(day)){
    if (l.mode!=='walk') continue;
    const r = store.get(rkey(l.from,l.to), null);
    km += r ? r.km : hav(l.from,l.to)*1.3;
  }
  return km;
}

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

function renderTabs(){
  tabsEl.innerHTML = DAYS.map(d=>`<button class="tab" role="tab" data-day="${d.id}" aria-selected="${view!=='prak' && d.id===dayId}">${d.short}<small>${d.date}</small></button>`).join('');
  prakBtn.setAttribute('aria-pressed', view==='prak');
}
tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  dayId = b.dataset.day; if (view==='prak') view = store.get('view','list');
  open = null; location.hash = dayId; render(); window.scrollTo(0,0);
});
prakBtn.addEventListener('click', ()=>{ view = view==='prak' ? store.get('view','list') : 'prak'; location.hash = view==='prak' ? 'praktisch' : dayId; render(); window.scrollTo(0,0); });

function badgeHtml(s){
  if (s.badge==='hl') return '<span class="badge hl">HOOGTEPUNT</span>';
  if (s.badge==='today') return '<span class="badge today">ENKEL VANDAAG</span>';
  if (s.badge==='opt') return '<span class="badge opt">OPTIE</span>';
  return '';
}

function renderDay(day){
  const kmNow = (function(){ let km=0; for(const l of legs(day)){ if(l.mode!=='walk') continue; const r=store.get(rkey(l.from,l.to),null); km += r? r.km : hav(l.from,l.to)*1.3; } return km; })();
  let html = `<div class="dayhead">
    <h2>${esc(day.title)}</h2>
    <div class="pills">
      <span class="pill sun">${ICON_SUN}${esc(day.weather)}</span>
      <span class="pill" id="kmpill">${ICON_WALK}± ${kmNow.toFixed(1).replace('.',',')} km stappen</span>
      <span class="pill">Zon onder ${day.sunset}</span>
    </div>
    <div class="seg" role="group" aria-label="Weergave">
      <button id="segList" aria-pressed="${view==='list'}">Lijst</button>
      <button id="segMap" aria-pressed="${view==='map'}">Kaart</button>
    </div>
  </div>`;

  if (view==='list'){
    html += '<div class="tl">';
    day.slots.forEach((s,i)=>{
      const st = slotState(s);
      const title = (st.alt && st.alt.ll && s.alts[0].id!==st.alt.id && !s.badge) ? `${esc(s.title)} · ${esc(st.alt.title)}` : esc(s.title);
      if (s.travel) html += `<div class="travel">${s.travel.mode==='walk'?ICON_WALK:ICON_TRANSIT}<span>${esc(s.travel.label)}</span></div>`;
      const last = i===day.slots.length-1 && !day.ret;
      const isOpen = open===s.id;
      html += `<div class="row">
        <div class="when"><b>${s.time}</b>${last?'':'<i></i>'}</div>
        <div class="card ${s.badge==='hl'?'hl':''} ${s.badge==='opt'?'opt':''}">
          <button class="card-btn" data-open="${s.id}" aria-expanded="${isOpen}">
            <div class="ttl"><h3>${title}</h3>${badgeHtml(s)}</div>
            <p class="desc">${esc(s.desc)}</p>
            ${(s.alts || s.todo || (s.facts&&s.facts.length)) ? `<div class="chips">
              ${s.facts && s.facts[0] ? `<span class="chip">${esc(s.facts[0][1])}</span>`:''}
              ${s.alts ? `<span class="chip alt">${s.alts.length} keuzes${st.alt && st.alt.id!==s.alts[0].id ? ' · '+esc(st.alt.title) : ''}</span>`:''}
              ${s.todo ? `<span class="chip todo">${esc(s.todo)}</span>`:''}
            </div>`:''}
          </button>
          ${isOpen ? renderMore(s, st) : ''}
        </div>
      </div>`;
    });
    if (day.ret) html += `<div class="travel">${day.ret.mode==='walk'?ICON_WALK:ICON_TRANSIT}<span>Terug: ${esc(day.ret.label)}</span></div>`;
    html += '</div>';
  } else {
    html += `<div class="mapwrap">
      <div id="map" role="region" aria-label="Kaart van de dag"></div>
      <div class="legend"><span><b></b> hotel</span><span><i></i> te voet</span><span><i class="d"></i> metro, tram of bus</span></div>
      <div class="maplist">${day.slots.map((s,i)=>`<button class="mapitem" data-fly="${i}"><span class="num">${i+1}</span><span><b>${s.time}</b> · ${esc(s.title)}</span></button>`).join('')}</div>
      <p class="note" id="routenote"></p>
    </div>`;
  }
  mainEl.innerHTML = html;

  document.getElementById('segList').onclick = ()=>{ view='list'; store.set('view','list'); render(); };
  document.getElementById('segMap').onclick = ()=>{ view='map'; store.set('view','map'); render(); };

  if (view==='list'){
    mainEl.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{ open = open===b.dataset.open ? null : b.dataset.open; render(); if(open){ const el = mainEl.querySelector(`[data-open="${open}"]`); if(el) el.scrollIntoView({block:'nearest'}); } });
    mainEl.querySelectorAll('input[data-alt]').forEach(r=> r.onchange = ()=>{ store.set('alt.'+r.dataset.alt, r.value); render(); });
  } else {
    buildMap(day);
  }
  updateKm(day);
}

function renderMore(s, st){
  const ll = st.ll;
  let h = '<div class="more">';
  if (s.img) h += `<figure class="photo"><img src="${s.img.src}" alt="${esc(s.title)}" loading="lazy" decoding="async"><figcaption>Foto: ${esc(s.img.by)} · <a href="https://commons.wikimedia.org/wiki/${encodeURIComponent(s.img.file).replace(/%3A/,':')}" target="_blank" rel="noopener">${esc(s.img.lic)}, Wikimedia Commons</a></figcaption></figure>`;
  if (s.long) h += `<p>${esc(s.long)}</p>`;
  if (s.facts) h += `<div class="facts">${s.facts.map(f=>`<div class="fact"><small>${esc(f[0])}</small><span>${esc(f[1])}</span></div>`).join('')}</div>`;
  if (s.alts){
    h += `<h4>Of liever…</h4><div class="alts">` + s.alts.map(a=>`<label class="alt ${st.alt.id===a.id?'on':''}"><input type="radio" name="alt-${s.id}" id="alt-${s.id}-${a.id}" data-alt="${s.id}" value="${a.id}" ${st.alt.id===a.id?'checked':''}><span><b>${esc(a.title)}</b><span>${esc(a.text)}</span></span></label>`).join('') + '</div>';
  }
  h += `<div class="links">
    <a class="lnk nav" href="${gm(ll)}" target="_blank" rel="noopener"><span>Navigeer er naartoe (Google Maps)</span>${ICON_OUT}</a>
    ${(s.links||[]).map(l=>`<a class="lnk" href="${l[1]}" target="_blank" rel="noopener"><span>${esc(l[0])}</span>${ICON_OUT}</a>`).join('')}
  </div></div>`;
  return h;
}

async function updateKm(day){
  // probeer ontbrekende wandelroutes op te halen, dan het km-pilletje bijwerken
  let changed = false;
  for (const l of legs(day)){
    if (l.mode!=='walk') continue;
    if (!store.get(rkey(l.from,l.to),null)){ const r = await fetchRoute(l.from,l.to); if (r) changed = true; }
  }
  const el = document.getElementById('kmpill');
  if (el && changed && dayId===day.id){ const km = await walkingKm(day); el.innerHTML = `${ICON_WALK}± ${km.toFixed(1).replace('.',',')} km stappen`; }
}

/* ================= KAART ================= */
function buildMap(day){
  if (!window.L){ const n=document.getElementById('routenote'); if(n) n.textContent='De kaartbibliotheek kon niet laden; controleer de internetverbinding.'; return; }
  if (map){ map.remove(); map=null; }
  map = L.map('map', {zoomControl:true, attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  layer = L.layerGroup().addTo(map);
  const pts = [];

  // hotel
  const hotelIcon = L.divIcon({className:'', html:'<div class="mk h">H</div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14]});
  L.marker(HOTEL.ll, {icon:hotelIcon}).addTo(layer).bindPopup(`<b>${HOTEL.name}</b><br>${HOTEL.addr}`);
  pts.push(HOTEL.ll);

  day.slots.forEach((s,i)=>{
    const st = slotState(s);
    const icon = L.divIcon({className:'', html:`<div class="mk">${i+1}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14]});
    const name = st.alt && st.alt.ll ? st.alt.title : s.title;
    L.marker(st.ll, {icon}).addTo(layer).bindPopup(`<b>${s.time} · ${esc(name)}</b><br>${esc(s.desc)}<br><a href="${gm(st.ll)}" target="_blank" rel="noopener">Navigeer</a>`);
    pts.push(st.ll);
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.12));

  // legs
  const note = document.getElementById('routenote');
  const ls = legs(day);
  let pending = 0, straight = 0;
  ls.forEach(l=>{
    if (l.mode==='walk'){
      const r = store.get(rkey(l.from,l.to), null);
      if (r){ L.polyline(r.pts, {color:'#C94A2C', weight:4, opacity:.9}).addTo(layer).bindPopup(esc(l.label)+`<br>± ${r.km.toFixed(1).replace('.',',')} km`); }
      else {
        const tmp = L.polyline([l.from,l.to], {color:'#C94A2C', weight:3, opacity:.5}).addTo(layer);
        pending++; straight++;
        fetchRoute(l.from,l.to).then(r=>{
          pending--;
          if (r && map){ layer.removeLayer(tmp); L.polyline(r.pts, {color:'#C94A2C', weight:4, opacity:.9}).addTo(layer).bindPopup(esc(l.label)+`<br>± ${r.km.toFixed(1).replace('.',',')} km`); straight--; }
          if (note) note.textContent = pending>0 ? 'Wandelroutes worden opgehaald…' : (straight>0 ? 'Geen routedienst bereikbaar: rechte lijnen tonen enkel de richting. Probeer later opnieuw.' : '');
        });
      }
    } else {
      L.polyline([l.from,l.to], {color:'#2E6E7E', weight:3, dashArray:'6 8', opacity:.9}).addTo(layer).bindPopup(esc(l.label));
    }
  });
  if (note) note.textContent = pending>0 ? 'Wandelroutes worden opgehaald…' : '';

  mainEl.querySelectorAll('[data-fly]').forEach(b=> b.onclick = ()=>{ const s = day.slots[+b.dataset.fly]; const ll = slotState(s).ll; map.flyTo(ll, 16, {duration:.6}); layer.eachLayer(x=>{ if (x.getLatLng && x.getLatLng().equals(L.latLng(ll))) x.openPopup(); }); });
}

/* ================= BOOT ================= */
function render(){
  renderTabs();
  if (view==='prak') renderPrak(); else renderDay(DAYS.find(d=>d.id===dayId));
}
function fromHash(){
  const h = (location.hash||'').replace('#','');
  if (h==='praktisch'){ view='prak'; return; }
  if (DAYS.some(d=>d.id===h)){ dayId = h; view = store.get('view','list'); return; }
  dayId = todayDefault(); view = store.get('view','list');
}
window.addEventListener('hashchange', ()=>{ fromHash(); open=null; render(); });
fromHash(); render();
